name: Build Mod
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'
      - name: Build
        working-directory: coord-screenshot-mod/coord-screenshot-mod
        run: gradle build
      - uses: actions/upload-artifact@v4
        with:
          name: coord-screenshot-mod
          path: coord-screenshot-mod/coord-screenshot-mod/build/libs/*.jar
